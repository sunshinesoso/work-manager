<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="건설업 업무관리 시스템 — 업무·프로젝트·현장·문서·일정 관리 대시보드">
<title>건설업 업무관리 시스템</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F1E36'/%3E%3Cg stroke='%23F59E0B' stroke-width='2' stroke-linecap='round' fill='none'%3E%3Cpath d='M10 26V8'/%3E%3Cpath d='M5 8h21'/%3E%3Cpath d='M10 8l4-3'/%3E%3C/g%3E%3Crect x='20' y='8' width='5' height='4' rx='1' fill='%23F59E0B'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;background:#F4F6FA;color:#0F1E36;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:#0F1E36}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:99px;border:3px solid #F4F6FA}
::-webkit-scrollbar-track{background:transparent}
.ic{flex:0 0 auto;display:block}

/* ============ layout ============ */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:20px 28px 44px;width:100%;max-width:1640px;margin:0 auto;flex:1}

/* ============ sidebar ============ */
.sidebar{width:248px;flex:0 0 248px;background:linear-gradient(168deg,#0F1E36 0%,#152B4C 58%,#101F38 100%);color:#C7D2E3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60}
.brand{display:flex;align-items:center;gap:12px;padding:22px 18px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{width:46px;height:46px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.brand-title{font-size:15.5px;font-weight:800;color:#fff;letter-spacing:-.2px;line-height:1.25}
.brand-text{display:flex;flex-direction:column;justify-content:center;min-width:0}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:#C7D2E3;text-align:left;transition:background .15s,color .15s;position:relative}
.nav-item svg{opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:linear-gradient(120deg,#2F6FE4,#1D4ED8);color:#fff;box-shadow:0 8px 18px rgba(29,78,216,.38)}
.nav-item .chev{margin-left:auto;opacity:.45}
.nav-item.active .chev{opacity:.9}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.07)}
.sidebar-backdrop{display:none}
.icon-btn.menu-btn{display:none}

/* ============ topbar ============ */
.topbar{display:flex;align-items:center;gap:16px;padding:22px 28px 0;flex-wrap:wrap;max-width:1640px;width:100%;margin:0 auto}
.topbar-left{display:flex;align-items:center;gap:16px;min-width:0}
.page-title{font-size:25px;font-weight:800;letter-spacing:-.7px;white-space:nowrap}
.date-chip{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#475569;white-space:nowrap}
.date-chip svg{color:#2563EB}
.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.icon-btn{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid #E6EBF2;display:inline-flex;align-items:center;justify-content:center;color:#334155;box-shadow:0 1px 2px rgba(15,30,54,.04);position:relative;transition:.15s}
.icon-btn:hover{background:#F8FAFF;border-color:#CBD9EE;color:#1D4ED8}
.search-wrap{position:relative;width:330px;max-width:44vw}
.search-wrap .search-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#94A3B8;pointer-events:none}
.search-wrap input{width:100%;height:42px;border-radius:12px;border:1px solid #E6EBF2;background:#fff;padding:0 14px 0 39px;font-size:13.5px;outline:none;box-shadow:0 1px 2px rgba(15,30,54,.04)}
.search-wrap input::placeholder{color:#A3B0C2}
.search-wrap input:focus{border-color:#9CBDF7;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.notif-wrap,.profile-wrap{position:relative}
.bell-dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:#EF4444;border:1.5px solid #fff;display:none}
.bell-dot.on{display:block}
.profile-btn{display:flex;align-items:center;gap:8px;height:42px;padding:0 10px 0 5px;border-radius:12px;border:1px solid #E6EBF2;background:#fff;box-shadow:0 1px 2px rgba(15,30,54,.04);font-weight:700;font-size:13px}
.avatar{width:32px;height:32px;border-radius:9px;background:#E8EEF8;color:#0F1E36;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;letter-spacing:.2px;flex:0 0 auto}
.profile-btn .chev{color:#94A3B8}

/* dropdowns */
.search-pop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid #E5EAF2;border-radius:14px;box-shadow:0 20px 44px rgba(15,30,54,.18);max-height:440px;overflow:auto;z-index:130;padding:6px}
.sr-group{padding:9px 11px 4px;font-size:10.5px;font-weight:800;color:#94A3B8;letter-spacing:.6px}
.sr-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:9px;font-size:13px;text-align:left}
.sr-item:hover{background:#F2F7FE}
.sr-item .sr-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#22314A}
.sr-item .sr-meta{font-size:11.5px;color:#94A3B8;white-space:nowrap}
.sr-empty{padding:18px 12px;font-size:13px;color:#94A3B8;text-align:center}
.notif-pop{position:absolute;top:calc(100% + 8px);right:0;width:340px;max-width:88vw;background:#fff;border:1px solid #E5EAF2;border-radius:16px;box-shadow:0 20px 44px rgba(15,30,54,.18);z-index:130;overflow:hidden}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #F1F4F9}
.notif-head b{font-size:14px}
.notif-head span{font-size:11.5px;color:#94A3B8}
.notif-body{max-height:340px;overflow:auto;padding:6px;overscroll-behavior:contain}
.notif-foot{padding:10px 12px;border-top:1px solid #F1F4F9;text-align:center}
.notif-sec{padding:8px 10px 2px;font-size:10.5px;font-weight:800;letter-spacing:.5px;color:#94A3B8}
.notif-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:9px;text-align:left;font-size:13px}
.notif-item:hover{background:#F5F8FE}
.notif-item .notif-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.notif-empty{padding:26px 16px;text-align:center;color:#94A3B8;font-size:13px}
.menu-pop{position:absolute;top:calc(100% + 8px);right:0;width:200px;background:#fff;border:1px solid #E5EAF2;border-radius:12px;box-shadow:0 18px 40px rgba(15,30,54,.16);padding:6px;z-index:130}
.menu-pop button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600;text-align:left;color:#334155}
.menu-pop button:hover{background:#F4F8FE}
.menu-pop .who{padding:10px 10px 8px;border-bottom:1px solid #F1F4F9;margin-bottom:4px}
.menu-pop .who b{display:block;font-size:13.5px;color:#0F1E36}
.menu-pop .who span{font-size:11.5px;color:#94A3B8}

/* ============ common bits ============ */
.card{background:#fff;border:1px solid #E9EEF5;border-radius:18px;box-shadow:0 1px 2px rgba(15,30,54,.04);overflow:hidden}
.panel{padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn-primary{background:#2563EB;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.24)}
.btn-primary:hover{background:#1D4ED8}
.btn-ghost{background:#fff;border-color:#E2E8F0;color:#334155}
.btn-ghost:hover{background:#F8FAFC;border-color:#CBD9EE}
.btn-light{background:#fff;color:#132444}
.btn-light:hover{background:#F1F6FF}
.btn-danger{background:#DC2626;color:#fff}
.btn-danger:hover{background:#B91C1C}
.btn-sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
.icon-sm{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#64748B;border:1px solid #E7ECF3;background:#fff;transition:.15s}
.icon-sm:hover{color:#1D4ED8;border-color:#C7D8F2;background:#F6FAFF}
.icon-sm.danger:hover{color:#DC2626;border-color:#F5C7C7;background:#FFF7F7}
.icon-sm.add{background:#EAF1FE;color:#2563EB;border-color:#D7E5FC}
.link{color:#2563EB;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:2px}
.link:hover{text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:7px;white-space:nowrap;line-height:1.25}
.badge.blue{background:#EAF1FE;color:#2563EB}
.badge.personal{background:#F1EDFE;color:#7C3AED}
.badge.company{background:#EAF1FE;color:#2563EB}
.badge.green{background:#E6F7EE;color:#15803D}
.badge.red{background:#FDECEC;color:#DC2626}
.badge.gray{background:#F1F4F9;color:#64748B}
.badge.orange{background:#FEF3E2;color:#B45309}
.badge.outline{background:#fff;border:1px solid #E2E8F0;color:#64748B}
.dday{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:800;white-space:nowrap;border:1px solid transparent}
.dday .dday-date{font-weight:700;opacity:.85}
.dday.red{background:#FFF1F1;color:#DC2626;border-color:#F8CFCF}
.dday.orange{background:#FFF6EA;color:#C2751A;border-color:#F6DCB8}
.dday.yellow{background:#FFFBEA;color:#A16207;border-color:#F3E4A8}
.dday.gray{background:#F4F6FA;color:#64748B;border-color:#E7ECF3}
.muted{color:#94A3B8}
.t-red{color:#DC2626}
.t-blue{color:#2563EB}
.t-green{color:#15803D}
.divider{height:1px;background:#F1F4F9}

/* ============ dashboard ============ */
.dash-top{display:grid;grid-template-columns:minmax(0,3.55fr) repeat(3,minmax(150px,1fr));gap:14px;align-items:stretch}
.banner{position:relative;overflow:hidden;padding:20px 24px;min-height:104px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(100deg,#E8F1FD 0%,#F5FAFF 55%,#EFF6FF 100%);border-color:#DBE8FA}
.banner-hello{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:-.6px;color:#0F1E36}
.banner-hello b{color:#1D4ED8}
.banner-hello .sun-ic{color:#F5A623;display:inline-flex}
.banner-sub{margin-top:7px;font-size:13.5px;color:#54657F;font-weight:500}
.banner-art{position:absolute;right:10px;bottom:-4px;width:238px;pointer-events:none;opacity:.95}
.sum-card{display:flex;align-items:center;gap:12px;padding:16px 18px;min-height:104px}
.sum-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tone-blue{background:#EAF1FE;color:#2563EB}
.tone-green{background:#E6F7EE;color:#16A34A}
.tone-red{background:#FDECEC;color:#DC2626}
.tone-orange{background:#FEF3E2;color:#D97706}
.tone-violet{background:#F1EDFE;color:#7C3AED}
.tone-slate{background:#EEF2F7;color:#475569}
.sum-label{font-size:12.5px;font-weight:700;color:#64748B;white-space:nowrap}
.sum-value{font-size:26px;font-weight:800;letter-spacing:-1px;color:#0F1E36;line-height:1.25}
.sum-value span{font-size:14px;font-weight:700;margin-left:1px;letter-spacing:0}
.dash-row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.dash-row3{display:grid;grid-template-columns:1fr 1.12fr 1.06fr;gap:16px;margin-top:16px}
.card-head{display:flex;align-items:center;gap:13px;padding:17px 20px;flex-wrap:wrap}
.card-head.dark{background:linear-gradient(118deg,#0F1E36 0%,#17325A 100%);color:#fff}
.head-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.13);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.head-icon.soft-blue{background:#EAF1FE;color:#2563EB}
.head-icon.soft-red{background:#FDECEC;color:#DC2626}
.head-text{flex:1 1 170px;min-width:0}
.head-text h2{font-size:20px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.head-text .count{font-size:19px;font-weight:800;color:#6FA8FF}
.card-head.light .head-text h2{font-size:17px;color:#0F1E36}
.card-head.light .count{color:#DC2626;font-size:16px}
.head-sub{font-size:12.5px;color:#A9BAD4;margin-top:3px}
.card-head.light .head-sub{color:#94A3B8}
.card-head .btn{margin-left:auto}
.card-head > .link{margin-left:auto}
.head-actions{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.card-head .head-actions .btn{margin-left:0}
.card-head.dark .link{color:#C9D8EC}
.card-head.dark .link:hover{color:#fff}
.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:11px;padding:10px 20px;min-height:46px;border-bottom:1px solid #F3F6FA}
.list-row:last-child{border-bottom:0}
.list-row:hover{background:#FBFCFE}
.list-row[data-action]{cursor:pointer}
.task-title{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:#22314A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row.is-done .task-title{color:#9AA8BA;text-decoration:line-through}
.chk{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.8px solid #CBD5E1;border-radius:6px;background:#fff;cursor:pointer;position:relative;flex:0 0 auto;transition:.15s}
.chk:hover{border-color:#94A3B8}
.chk:checked{background:#16A34A;border-color:#16A34A}
.chk:checked::after{content:'';position:absolute;left:6px;top:2.5px;width:5px;height:9px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dot.red{background:#EF4444}
.list-more{padding:9px 20px;border-top:1px solid #F3F6FA;text-align:center}
.week-nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.week-range{font-size:12.5px;font-weight:800;color:#334155;white-space:nowrap}
.week-row{display:flex;align-items:center;gap:10px;padding:8px 18px;min-height:38px;border-bottom:1px solid #F3F6FA;width:100%;text-align:left}
.week-row:last-child{border-bottom:0}
.week-row:hover{background:#FBFCFE}
.week-row.hl{background:#F1F6FE}
.week-date{width:76px;flex:0 0 auto;font-size:12.5px;font-weight:700;color:#475569;white-space:nowrap}
.week-row.sun .week-date{color:#DC2626}
.week-row.sat .week-date{color:#2563EB}
.week-title{flex:1;min-width:0;font-size:13px;font-weight:600;color:#22314A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week-title.done{color:#9AA8BA;text-decoration:line-through}
.week-scroll{max-height:274px;overflow-y:auto}
.week-scroll::-webkit-scrollbar{width:6px}
.week-scroll::-webkit-scrollbar-thumb{background:#DCE4EF;border:0;border-radius:99px}
.week-row.more .week-empty{color:#94A3B8}
.week-empty{font-size:12.5px;color:#B6C1D0}
.donut-wrap{display:flex;align-items:center;gap:16px;padding:14px 20px 18px;flex-wrap:wrap;justify-content:flex-start;flex:1}
.donut-wrap.is-clickable{cursor:pointer;transition:background .15s}
.donut-wrap.is-clickable:hover{background:#F7FAFF}
.donut-wrap.is-clickable:focus-visible{outline:2px solid #9CBDF7;outline-offset:-3px}
.donut-hint{flex:1 0 100%;display:flex;align-items:center;justify-content:flex-end;gap:1px;font-size:11.5px;font-weight:800;color:#2563EB;margin-top:-4px}
.donut-wrap.is-clickable:hover .donut-hint{text-decoration:underline}
.month-bar{display:flex;align-items:center;gap:6px;padding:8px 18px;border-bottom:1px solid #F1F4F9}
.month-range{font-size:13px;font-weight:800;color:#16284A;white-space:nowrap;min-width:54px;text-align:center}
.donut-svg{width:190px;height:190px;flex:0 0 auto}
.legend{flex:1;min-width:130px;max-width:230px;display:flex;flex-direction:column;gap:13px;padding-right:4px}
.leg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#475569}
.leg i{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.leg span{font-weight:600}
.leg b{margin-left:auto;font-weight:800;color:#0F1E36}
.leg em{font-style:normal;color:#94A3B8;font-size:11.5px;font-weight:700}

/* ============ empty ============ */
.empty{padding:44px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty.compact{padding:26px 18px}
.empty-icon{width:48px;height:48px;border-radius:14px;background:#F1F5FB;color:#93A4BE;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.empty-title{font-size:14px;font-weight:800;color:#334155}
.empty-desc{font-size:12.5px;color:#94A3B8;max-width:320px;line-height:1.6}
.empty .btn{margin-top:8px}

/* ============ view heads / toolbars ============ */
.view-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.view-head-text{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.month-chip{background:#EEF4FE;color:#2563EB}
.toolbar select.month-select{border-color:#C7D8F2;background:#F8FBFF;font-weight:700;color:#1D4ED8}
.view-title{font-size:20px;font-weight:800;letter-spacing:-.5px}
.view-sub{font-size:13px;color:#7C8BA3;margin-top:0;font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;background:#fff;border:1px solid #E9EEF5;border-radius:14px;padding:11px 13px}
.toolbar .search-box{position:relative;flex:1;min-width:180px;max-width:320px}
.toolbar .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#94A3B8}
.toolbar .search-box input{width:100%;height:38px;border:1px solid #E2E8F0;border-radius:10px;padding:0 12px 0 34px;outline:none;background:#fff}
.toolbar .search-box input:focus{border-color:#9CBDF7;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.toolbar select,.toolbar input[type="date"]{height:38px;border:1px solid #E2E8F0;border-radius:10px;padding:0 10px;background:#fff;outline:none;max-width:100%}
.toolbar select:focus,.toolbar input[type="date"]:focus{border-color:#9CBDF7;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.toolbar .spacer{flex:1}
.chip-filter{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:99px;background:#EEF4FE;color:#2563EB;font-size:12px;font-weight:700}

/* ============ tables ============ */
.table-card{background:#fff;border:1px solid #E9EEF5;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(15,30,54,.04)}
.table-scroll{overflow-x:auto}
.table{width:100%;border-collapse:collapse;min-width:760px}
.table th{text-align:left;font-size:11.5px;color:#64748B;font-weight:800;background:#F8FAFC;padding:11px 16px;border-bottom:1px solid #EDF1F6;white-space:nowrap;letter-spacing:.2px}
.table td{padding:11px 16px;border-bottom:1px solid #F3F6FA;font-size:13px;vertical-align:middle;color:#334155}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr:hover{background:#FBFCFE}
.table .cell-title{font-weight:700;color:#1E293B;display:flex;align-items:center;gap:8px;min-width:0}
.table .cell-title .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.table .nowrap{white-space:nowrap}
.table .actions{display:flex;gap:6px;justify-content:flex-end}
.mini-select{height:30px;border-radius:8px;border:1px solid #E2E8F0;background:#fff;padding:0 6px;font-size:12px;font-weight:700;outline:none;cursor:pointer;color:#475569}
.mini-select.st-done{background:#E6F7EE;border-color:#C7EBD6;color:#15803D}
.mini-select.st-progress{background:#EAF1FE;border-color:#D6E4FC;color:#2563EB}
.mini-select.st-waiting{background:#F1F4F9;border-color:#E5EAF2;color:#64748B}
.mini-select.doc-submitted{background:#E6F7EE;border-color:#C7EBD6;color:#15803D}
.mini-select.doc-writing{background:#F1F4F9;border-color:#E5EAF2;color:#64748B}
.mini-select.doc-fix{background:#FDECEC;border-color:#F7D2D2;color:#DC2626}

/* ============ entity cards ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.entity{background:#fff;border:1px solid #E9EEF5;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:13px;box-shadow:0 1px 2px rgba(15,30,54,.04)}
.entity-head{display:flex;align-items:flex-start;gap:11px}
.entity-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.entity-title{flex:1;min-width:0;font-size:15px;font-weight:800;letter-spacing:-.3px;color:#132444;line-height:1.35;word-break:break-all}
.entity-sub{font-size:12px;color:#94A3B8;font-weight:600;margin-top:3px;word-break:break-all}
.meta-list{display:flex;flex-direction:column;gap:7px}
.meta-list > div{display:flex;gap:10px;font-size:12.5px}
.meta-list span{width:62px;flex:0 0 auto;color:#94A3B8;font-weight:700}
.meta-list b{color:#334155;font-weight:600;min-width:0;word-break:break-all}
.progress-row{display:flex;align-items:center;gap:10px}
.progress{flex:1;height:8px;border-radius:99px;background:#EEF2F8;overflow:hidden}
.progress span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2563EB,#60A5FA);transition:width .3s}
.progress-row b{font-size:12.5px;font-weight:800;color:#2563EB;min-width:38px;text-align:right}
.entity-foot{display:flex;align-items:center;gap:6px;border-top:1px solid #F1F4F9;padding-top:12px;margin-top:auto}
.entity-foot .btn{margin-right:auto}
.pill-count{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:7px;background:#F4F7FC;color:#475569}

/* ============ calendar ============ */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-title{font-size:20px;font-weight:800;letter-spacing:-.5px;min-width:130px}
.cal-head .spacer{flex:1}
.cal{background:#fff;border:1px solid #E9EEF5;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(15,30,54,.04)}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);background:#F8FAFC;border-bottom:1px solid #EDF1F6}
.cal-weekdays div{padding:10px 6px;text-align:center;font-size:12px;font-weight:800;color:#64748B}
.cal-weekdays div:first-child{color:#DC2626}
.cal-weekdays div:last-child{color:#2563EB}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:122px;border-right:1px solid #F1F4F9;border-bottom:1px solid #F1F4F9;padding:7px 8px 9px;cursor:pointer;position:relative;transition:background .12s;text-align:left;width:100%;display:block}
.cal-cell:nth-child(7n){border-right:0}
.cal-grid > .cal-cell:nth-last-child(-n+7){border-bottom:0}
.cal-cell:hover{background:#FBFDFF}
.cal-cell.out{background:#FAFBFC}
.cal-date{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:12.5px;font-weight:800;color:#334155;margin-bottom:5px}
.cal-cell.out .cal-date{color:#C3CDDB}
.cal-cell.sun .cal-date{color:#DC2626}
.cal-cell.sat .cal-date{color:#2563EB}
.cal-cell.today{background:#F4F8FF;box-shadow:inset 0 0 0 2px #C4D9FA}
.cal-cell.today .cal-date{background:#2563EB;color:#fff}
.chip{display:block;font-size:11px;font-weight:700;border-radius:6px;padding:3px 6px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.chip.event-company{background:#EAF1FE;color:#1D4ED8}
.chip.event-personal{background:#F3EEFE;color:#6D28D9}
.chip.task{background:#F1F5F9;color:#475569;border-left:3px solid #94A3B8}
.chip.task.done{opacity:.55;text-decoration:line-through}
.chip.task.overdue{background:#FFF1F1;color:#B91C1C;border-left-color:#EF4444}
.chip.more{background:none;color:#8494AA;padding-left:2px}
.cal-legend{display:flex;align-items:center;gap:14px;margin-top:12px;font-size:12px;color:#64748B;flex-wrap:wrap}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cal-empty{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;background:#EFF6FF;border:1px solid #DCE9FB;border-radius:12px;font-size:13px;color:#475569;font-weight:500;line-height:1.55}
.cal-empty > span:first-child{color:#2563EB;display:inline-flex}
.cal-empty .btn{margin-left:auto}

/* ============ reports ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid #E9EEF5;border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(15,30,54,.04)}
.kpi-label{font-size:12.5px;font-weight:700;color:#64748B;display:flex;align-items:center;gap:6px}
.kpi-value{font-size:27px;font-weight:800;letter-spacing:-1px;margin-top:6px;color:#0F1E36}
.kpi-value small{font-size:13px;font-weight:700;margin-left:2px}
.kpi-note{font-size:11.5px;color:#94A3B8;margin-top:4px;font-weight:600}
.report-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
.report-card{background:#fff;border:1px solid #E9EEF5;border-radius:16px;box-shadow:0 1px 2px rgba(15,30,54,.04);overflow:hidden;display:flex;flex-direction:column}
.report-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid #F1F4F9}
.report-head h3{font-size:14.5px;font-weight:800;flex:1}
.report-head .sub{font-size:11.5px;color:#94A3B8;font-weight:600}
.report-body{padding:16px 18px;flex:1}
.chart-wrap{width:100%;overflow-x:auto}
.bar-chart{width:100%;min-width:420px;height:auto;display:block}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;font-size:11.5px;color:#64748B;font-weight:800;padding:8px 10px;border-bottom:1px solid #EDF1F6;white-space:nowrap}
.data-table td{padding:9px 10px;border-bottom:1px solid #F4F7FB;font-size:12.5px;color:#334155}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.data-table .t-strong{font-weight:700;color:#132444}
.mini-progress{height:6px;border-radius:99px;background:#EEF2F8;min-width:60px;overflow:hidden}
.mini-progress span{display:block;height:100%;border-radius:99px;background:#3B82F6}

/* ============ settings ============ */
.settings-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.set-card{background:#fff;border:1px solid #E9EEF5;border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(15,30,54,.04)}
.set-card h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.set-desc{font-size:12.5px;color:#8494AA;margin-top:5px;line-height:1.65}
.set-form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.profile-preview{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:#F7FAFF;border:1px solid #E7EFFB;margin-top:14px}
.profile-preview .avatar{width:42px;height:42px;border-radius:11px;font-size:15px}
.profile-preview b{font-size:14px}
.profile-preview span{display:block;font-size:11.5px;color:#94A3B8;margin-top:2px}
.data-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.data-stats div{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 11px;background:#F8FAFC;border-radius:9px;color:#64748B}
.data-stats b{color:#0F1E36}
.set-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.danger-zone{border-color:#F6D5D5;background:linear-gradient(180deg,#FFF9F9,#fff)}
.danger-zone h3{color:#B91C1C}
.note{font-size:11.5px;color:#94A3B8;margin-top:10px;line-height:1.6}

/* ============ modal ============ */
.modal-open{overflow:hidden}
.modal-backdrop{position:fixed;inset:0;background:rgba(13,26,46,.46);display:flex;align-items:flex-start;justify-content:center;padding:42px 16px;z-index:200;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:0 26px 66px rgba(10,22,40,.32);animation:pop .16s ease-out;margin:auto 0}
.modal.wide{max-width:760px}
@keyframes pop{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;padding:17px 22px;border-bottom:1px solid #EEF2F7}
.modal-head h3{margin:0;font-size:16.5px;font-weight:800;flex:1;letter-spacing:-.3px}
.modal-body{padding:20px 22px}
.modal-foot{padding:0 22px 20px;display:flex;justify-content:flex-end;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1 / -1}
.f label{font-size:12.5px;font-weight:700;color:#475569}
.f input,.f select,.f textarea{width:100%;height:40px;border:1px solid #E2E8F0;border-radius:10px;padding:0 11px;background:#fff;outline:none;transition:.15s}
.f textarea{height:78px;padding:9px 11px;resize:vertical;line-height:1.55}
.f input:focus,.f select:focus,.f textarea:focus{border-color:#9CBDF7;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.f input.invalid,.f textarea.invalid{border-color:#F19A9A;background:#FFFAFA}
.f .hint{font-size:11px;color:#94A3B8}
.req{color:#DC2626}
.modal .section-label{font-size:11px;font-weight:800;color:#94A3B8;letter-spacing:.5px;grid-column:1/-1;margin-top:2px}
.detail-list{display:flex;flex-direction:column;gap:0;border:1px solid #EEF2F7;border-radius:12px;overflow:hidden;max-height:260px;overflow-y:auto}
.detail-row{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid #F3F6FA;font-size:12.5px}
.detail-row:last-child{border-bottom:0}
.detail-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#334155}
.detail-sec{font-size:12px;font-weight:800;color:#64748B;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.detail-sec:first-child{margin-top:0}
.detail-empty{font-size:12.5px;color:#94A3B8;padding:14px;text-align:center;background:#F8FAFC;border-radius:10px}
.confirm-text{font-size:13.5px;color:#475569;line-height:1.7;white-space:pre-line}

/* ============ toast ============ */
#toastRoot{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:400;align-items:flex-end}
.toast{background:#0F1E36;color:#fff;padding:11px 15px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(15,30,54,.28);animation:toastIn .2s ease-out;max-width:340px;display:flex;align-items:center;gap:8px}
.toast .ic{color:#7DD3A4}
@keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ============ view transition ============ */
@keyframes viewIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.view-anim{animation:viewIn .2s ease-out}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ============ bulk selection ============ */
.bulk-chk{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.8px solid #B9C6D8;border-radius:5px;background:#fff;cursor:pointer;position:relative;flex:0 0 auto;transition:.15s;margin:0;vertical-align:middle}
.bulk-chk:hover{border-color:#2563EB}
.bulk-chk:checked{background:#2563EB;border-color:#2563EB}
.bulk-chk:checked::after{content:'';position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.bulk-chk:indeterminate{background:#2563EB;border-color:#2563EB}
.bulk-chk:indeterminate::after{content:'';position:absolute;left:3px;top:6.5px;width:9px;height:2px;background:#fff;border-radius:1px}
.bulk-chk:focus-visible{outline:2px solid #9CBDF7;outline-offset:2px}
.bulk-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;background:#fff;border:1px solid #E9EEF5;border-radius:14px;padding:9px 13px}
.bulk-bar .bulk-all-label{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#475569;cursor:pointer;user-select:none}
.bulk-count{font-size:12px;font-weight:800;color:#2563EB;background:#EEF4FE;border-radius:99px;padding:4px 10px;min-width:66px;text-align:center}
.bulk-count.zero{color:#94A3B8;background:#F1F4F9}
.bulk-bar .spacer{flex:1}
.bulk-bar .btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn-bulk-done{background:#E6F7EE;color:#15803D;border-color:#C7EBD6}
.btn-bulk-done:not([disabled]):hover{background:#D8F1E4;border-color:#A9DFC0}
.btn-bulk-del{background:#FDECEC;color:#DC2626;border-color:#F7D2D2}
.btn-bulk-del:not([disabled]):hover{background:#FBDDDD;border-color:#F2B9B9}
.bulk-hint{font-size:11.5px;color:#94A3B8;font-weight:600}
.sel-cell{width:46px}
.table td.sel-cell,.table th.sel-cell{padding-left:14px;padding-right:4px}
.table td.sel-cell .bulk-chk,.table th.sel-cell .bulk-chk{display:block;margin:0 auto}
.table tbody tr.is-selected{background:#F4F8FF}
.att tbody tr.is-selected td{background:#F4F8FF}
.entity.is-selected{border-color:#9CBDF7;box-shadow:0 0 0 3px rgba(37,99,235,.10);background:linear-gradient(180deg,#F8FBFF,#fff)}
.entity-head .bulk-chk{margin-top:3px}
.list-row .bulk-chk{margin-right:2px}
.chip.is-done{opacity:.5;text-decoration:line-through}

/* ============ labor ledger ============ */
.labor-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.labor-month{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:4px 10px;font-weight:700;font-size:13px;height:38px}
.labor-month input[type="month"]{border:0;background:transparent;font-weight:800;color:#0F1E36;outline:none;font-size:13.5px}
.labor-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
.labor-kpi{background:#fff;border:1px solid #E9EEF5;border-radius:14px;padding:13px 16px;box-shadow:0 1px 2px rgba(15,30,54,.04)}
.labor-kpi .k{font-size:12px;font-weight:700;color:#64748B;display:flex;align-items:center;gap:5px}
.labor-kpi .v{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-top:4px;color:#0F1E36}
.labor-kpi .v small{font-size:12px;font-weight:700;color:#64748B;margin-left:2px}
.labor-kpi.tax-on{border-color:#C7EBD6;background:linear-gradient(180deg,#F7FDF9,#fff)}
.labor-sec{margin-top:16px}
.labor-sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:15px 18px;border-bottom:1px solid #F1F4F9}
.labor-sec-head h3{font-size:15px;font-weight:800;letter-spacing:-.3px;flex:1;min-width:120px;display:flex;align-items:center;gap:7px}
.labor-sec-head .sub{font-size:11.5px;color:#94A3B8;font-weight:600}
.labor-sec .bulk-wrap{padding:12px 16px 0}
.labor-sec .table-wrap{overflow:auto}
.labor-table{width:100%;border-collapse:collapse;min-width:760px}
.labor-table th{text-align:left;font-size:11.5px;color:#64748B;font-weight:800;background:#F8FAFC;padding:9px 10px;border-bottom:1px solid #EDF1F6;white-space:nowrap}
.labor-table td{padding:8px 10px;border-bottom:1px solid #F3F6FA;font-size:12.5px;color:#334155;vertical-align:middle}
.labor-table tbody tr:last-child td{border-bottom:0}
.labor-table tbody tr:hover{background:#FBFCFE}
.labor-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.labor-table .nowrap{white-space:nowrap}
.labor-table .nm{font-weight:700;color:#1E293B;white-space:nowrap}
.labor-table .actions{display:flex;gap:5px;justify-content:flex-end}
.labor-empty{padding:26px 18px;text-align:center;color:#94A3B8;font-size:12.5px}
.att-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:11px 16px;background:#F8FAFC;border-bottom:1px solid #EDF1F6}
.att-tools .sep{width:1px;height:20px;background:#E2E8F0;margin:0 2px}
.att-tools input[type="number"]{width:58px;height:32px;border:1px solid #E2E8F0;border-radius:8px;padding:0 7px;outline:none}
.att-tools select{height:32px;border:1px solid #E2E8F0;border-radius:8px;padding:0 6px;background:#fff;outline:none;max-width:120px}
.att-tools label.tiny{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#475569;cursor:pointer}
.att-wrap{overflow:auto;max-height:620px}
.att{border-collapse:separate;border-spacing:0;font-size:12px;width:max-content;min-width:100%}
.att th,.att td{border-bottom:1px solid #F1F4F9;border-right:1px solid #F5F8FC;padding:0;background:#fff}
.att thead th{position:sticky;top:0;z-index:5;background:#F8FAFC;color:#64748B;font-size:11px;font-weight:800;padding:5px 0;text-align:center;white-space:nowrap}
.att thead th.we-sun{color:#DC2626}
.att thead th.we-sat{color:#2563EB}
.att .col-sel,.att .col-name{position:sticky;z-index:4;background:#fff}
.att .col-sel{left:0;width:36px;min-width:36px;text-align:center;padding:0}
.att .col-name{left:36px;min-width:82px;max-width:82px;padding:0 8px;font-weight:800;color:#1E293B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att thead .col-sel,.att thead .col-name{z-index:7;background:#F8FAFC}
.att-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:36px;font-weight:800;color:#64748B;gap:0;cursor:pointer;transition:background .1s}
.att-cell .v{font-size:11.5px;line-height:1.15}
.att-cell .a{font-size:9px;font-weight:800;color:#2563EB;line-height:1.1}
.att-cell.on{background:#EFF6FF}
.att-cell.on .v{color:#1D4ED8}
.att-cell.sun.on{background:#FFF4F4}
.att-cell.sat.on{background:#EEF4FE}
.att-cell:hover{box-shadow:inset 0 0 0 2px #BFD5F7}
.att td.tot{padding:0 7px;text-align:right;font-variant-numeric:tabular-nums;color:#334155;white-space:nowrap;font-weight:600}
.att td.tot.strong{font-weight:800;color:#0F1E36}
.att td.tot.money{color:#1D4ED8}
.att td.tot.minus{color:#DC2626}
.att tfoot td{position:sticky;bottom:0;background:#F8FAFC;font-weight:800;border-top:1px solid #E2E8F0;text-align:right;padding:7px;white-space:nowrap;font-size:11.5px;z-index:4}
.att tfoot td.lead{text-align:left}
.paid-badge{font-size:10.5px;font-weight:800;color:#15803D;background:#E6F7EE;border-radius:6px;padding:2px 6px;white-space:nowrap}
.labor-note{font-size:11.5px;color:#94A3B8;line-height:1.6;margin-top:8px;padding:0 4px}

/* ============ responsive ============ */
@media (max-width:1480px){
  .banner-art{width:200px;opacity:.85}
  .banner-hello{font-size:20px}
}
@media (max-width:1360px){
  .dash-top{grid-template-columns:repeat(3,minmax(0,1fr))}
  .banner{grid-column:1 / -1;min-height:92px}
  .banner-art{width:220px}
}
@media (max-width:1240px){
  .dash-row3{grid-template-columns:1fr 1fr}
  .dash-row3 > :nth-child(3){grid-column:1 / -1}
  .search-wrap{width:270px}
  .report-grid{grid-template-columns:1fr}
}
@media (max-width:1080px){
  .dash-row2{grid-template-columns:1fr}
  .settings-grid{grid-template-columns:1fr}
  .content{padding:18px 20px 40px}
  .topbar{padding:18px 20px 0}
}
@media (max-width:900px){
  body.nav-open{overflow:hidden}
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:100vh;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 50px rgba(0,0,0,.3)}
  body.nav-open .sidebar{transform:none}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,30,54,.42);z-index:55}
  body.nav-open .sidebar-backdrop{display:block}
  .icon-btn.menu-btn{display:inline-flex}
  .topbar{gap:8px;padding:14px 16px 0;align-items:center}
  .page-title{font-size:22px}
  .topbar-left{gap:10px;flex:1 1 auto;min-width:0}
  .date-chip{display:none}
  .topbar-right{display:contents}
  .notif-wrap{order:1;margin-left:auto}
  .profile-wrap{order:2}
  .search-wrap{order:3;width:100%;max-width:none;flex:1 1 100%;margin-top:2px}
  .content{padding:14px 16px 36px}
  .dash-top{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dash-top .banner{grid-column:1 / -1}
  .dash-row3{grid-template-columns:1fr}
  .dash-row3 > :nth-child(3){grid-column:auto}
  .cal-cell{min-height:96px}
  .banner-art{display:none}
}
@media (max-width:640px){
  .page-title{font-size:19px}
  #todayLabel{display:none}
  .sum-card{min-height:84px;padding:13px 14px;gap:10px}
  .sum-icon{width:40px;height:40px;border-radius:12px}
  .sum-value{font-size:22px}
  .sum-label{font-size:11.5px}
  .dash-top{grid-template-columns:1fr 1fr;gap:10px}
  .dash-top > .sum-card:last-child{grid-column:1 / -1}
  .banner-hello{font-size:17px}
  .banner-sub{font-size:12.5px}
  .head-text h2{font-size:17px}
  .head-text .count{font-size:16px}
  .head-icon{width:38px;height:38px}
  .card-head{padding:14px 15px;gap:10px}
  .list-row{padding:9px 15px;gap:8px}
  .week-date{width:66px;font-size:11.5px}
  .form-grid{grid-template-columns:1fr}
  .modal-backdrop{padding:16px 10px}
  .modal-body{padding:16px}
  .modal-foot{padding:0 16px 16px}
  .grid{grid-template-columns:1fr}
  .donut-wrap{justify-content:center}
  .legend{max-width:none;width:100%}
  .cal-cell{min-height:78px;padding:5px}
  .chip{font-size:10px;padding:2px 4px}
  .cal-date{width:20px;height:20px;font-size:11px}
  .toolbar .search-box{max-width:none}
  .toast{max-width:calc(100vw - 32px)}
  #toastRoot{right:16px;left:16px;align-items:stretch}
}
@media (max-width:520px){
  .card-head .head-actions{width:100%;margin-left:0;justify-content:flex-end;gap:8px}
  .dday .dday-date{display:none}
}
@media (max-width:640px){
  .bulk-hint{display:none}
  .bulk-count{min-width:0}
  .bulk-bar{gap:8px;padding:8px 11px}
  .labor-kpi .v{font-size:17px}
  .labor-bar .btn{flex:1 1 auto}
}
@media print{
  .sidebar,.topbar,.sidebar-backdrop,#toastRoot{display:none !important}
  .app{display:block}
  .content{padding:0;max-width:none}
  .card,.report-card,.kpi,.table-card{box-shadow:none;break-inside:avoid}
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="주 메뉴">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.5 28.5V5.5"></path>
          <path d="M3 5.5h23"></path>
          <path d="M8.5 5.5l4.8-3.6"></path>
          <path d="M8.5 11.2l4.2 3.4M12.7 11.2l-4.2 3.4M8.5 18l4.2 3.4M12.7 18l-4.2 3.4"></path>
          <path d="M19 5.5v4.6" stroke="#FBBF24"></path>
          <rect x="16.4" y="10.1" width="5.4" height="4" rx="0.9" fill="#F59E0B" stroke="none"></rect>
          <path d="M4 28.5h9"></path>
          <path d="M25.6 5.5v3" stroke="#FBBF24"></path>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">업무관리 시스템</div>
      </div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>
  <div class="sidebar-backdrop" data-action="close-sidebar"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn menu-btn" data-action="toggle-sidebar" aria-label="메뉴 열기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </button>
        <h1 class="page-title" id="pageTitle">대시보드</h1>
        <div class="date-chip"><span data-icon="calendar"></span><span id="todayLabel"></span></div>
      </div>
      <div class="topbar-right">
        <div class="search-wrap">
          <span class="search-ic" data-icon="search"></span>
          <input id="globalSearch" type="search" placeholder="업무, 문서, 현장, 일정 검색..." autocomplete="off" aria-label="통합 검색">
          <div class="search-pop" id="searchPop" hidden></div>
        </div>
        <div class="notif-wrap">
          <button class="icon-btn" id="bellBtn" data-action="toggle-notif" aria-label="알림">
            <span data-icon="bell"></span>
            <span class="bell-dot" id="bellDot"></span>
          </button>
          <div class="notif-pop" id="notifPop" hidden></div>
        </div>
        <div class="profile-wrap">
          <button class="profile-btn" data-action="toggle-profile" aria-label="내 정보 메뉴">
            <span class="avatar" id="topAvatar">ny</span>
            <span id="topName">ny</span>
            <span data-icon="chevron-down"></span>
          </button>
          <div class="menu-pop" id="profilePop" hidden></div>
        </div>
      </div>
    </header>
    <main class="content" id="viewRoot" role="main"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

/* ========================= date ========================= */
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayISO() { return ymd(new Date()); }
function isISODate(v) { return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v); }
function parseISO(iso) {
  if (!isISODate(iso)) return null;
  var p = iso.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}
function addDays(d, n) {
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}
function diffDays(fromISO, toISO) {
  var a = parseISO(fromISO), b = parseISO(toISO);
  if (!a || !b) return 0;
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}
function fmtFull(iso) {
  var d = parseISO(iso);
  if (!d) return '';
  return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEKDAYS[d.getDay()] + ')';
}
function fmtShort(iso) {
  var d = parseISO(iso);
  if (!d) return '';
  return (d.getMonth() + 1) + '.' + d.getDate() + ' (' + WEEKDAYS[d.getDay()] + ')';
}
function fmtDot(iso) {
  var d = parseISO(iso);
  if (!d) return '';
  return (d.getMonth() + 1) + '.' + pad2(d.getDate());
}
function monthKeyOf(iso) { return (iso || '').slice(0, 7); }
function currentMonthKey() { return monthKeyOf(todayISO()); }
function monthKeyAdd(key, n) {
  var p = str(key).split('-');
  if (p.length !== 2 || !/^\d{4}$/.test(p[0]) || !/^\d{1,2}$/.test(p[1])) return currentMonthKey();
  var d = new Date(Number(p[0]), Number(p[1]) - 1 + Number(n || 0), 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}
function monthLabelFull(key) {
  var p = str(key).split('-');
  if (p.length !== 2) return '';
  return Number(p[0]) + '년 ' + Number(p[1]) + '월';
}
/* 같은 해면 '11월', 다른 해면 '2026년 11월' */
function monthLabelAdaptive(key) {
  var p = str(key).split('-');
  if (p.length !== 2) return '';
  return Number(p[0]) === new Date().getFullYear() ? Number(p[1]) + '월' : monthLabelFull(key);
}
function startOfWeek(d) {
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var dow = x.getDay();
  return addDays(x, dow === 0 ? -6 : 1 - dow);
}
function ddayTone(n) {
  if (n <= 1) return 'red';
  if (n === 2) return 'orange';
  return 'yellow';
}

}
function uid(prefix) {
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function byId(list, id) {
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }

}

function safeId(v, prefix) {
  var s = str(v);

}

function normalizeDB(raw) {

function selMap(section) {

}

function syncBulkUI() {

    if (!bar) return;
    var boxes = document.querySelectorAll('[data-action="bulk-item"][data-bulk="' + section + '"]');
    var total = boxes.length, checked = 0, i;
    for (i = 0; i < boxes.length; i++) { if (boxes[i].checked) checked++; }
    if (checked !== selCount(section)) {
      var m = {};
      for (i = 0; i < boxes.length; i++) { if (boxes[i].checked) m[boxes[i].getAttribute('data-id')] = true; }
      ui.sel[section] = m;
    }
    var allBoxes = document.querySelectorAll('[data-action="bulk-all"][data-bulk="' + section + '"]');
    for (i = 0; i < allBoxes.length; i++) {
      allBoxes[i].checked = total > 0 && checked === total;
      allBoxes[i].indeterminate = checked > 0 && checked < total;
      allBoxes[i].disabled = total === 0;
    }
    var countEl = bar.querySelector('[data-bulk-count]');
    if (countEl) {
      countEl.textContent = checked + '건 선택';
      countEl.className = 'bulk-count' + (checked ? '' : ' zero');

function bulkNames(section, ids) {
  var out = [];
  ids.forEach(function (id) {
    var x = null;
    if (section === 'tasks') x = byId(db.tasks, id);
    else if (section === 'projects') x = byId(db.projects, id);
    else if (section === 'sites') x = byId(db.sites, id);
    else if (section === 'docs') x = byId(db.docs, id);
    else x = byId(db.events, id);
    if (x) out.push(x.title || x.name);
  });
  return out.slice(0, 5).map(function (n) {
    n = str(n);
    return '· ' + (n.length > 24 ? n.slice(0, 24) + '…' : n);

function bulkComplete(section) {
  var ids = selIds(section);
  if (!ids.length) { toast('선택된 항목이 없습니다.', 'alert'); return; }
  var changed = 0, skipped = 0;
  if (section === 'tasks') {
    ids.forEach(function (id) {
      var t = byId(db.tasks, id);
      if (!t) return;
      if (t.status === 'done') { skipped++; return; }
      t.status = 'done';
      if (!t.completedAt) t.completedAt = todayISO();
      changed++;
    });
  } else if (section === 'docs') {
    ids.forEach(function (id) {
      var d = byId(db.docs, id);
      if (!d) return;
      if (d.status === 'submitted') { skipped++; return; }
      d.status = 'submitted';
      changed++;
    });
  } else if (section === 'projects' || section === 'sites') {
    var list = section === 'projects' ? db.projects : db.sites;
    ids.forEach(function (id) {
      var p = byId(list, id);
      if (!p) return;
      if (p.status === 'done') { skipped++; return; }
      p.status = 'done';
      changed++;
    });
  } else if (section === 'events') {
    ids.forEach(function (id) {
      var e = byId(db.events, id);
      if (!e) return;
      if (e.done) { skipped++; return; }
      e.done = true;
      changed++;
    });
  }
  clearSel(section);
  if (!changed) { render(); toast('이미 완료된 항목만 선택되어 있습니다.', 'alert'); return; }
  saveDB();
  render();
  var labels = { tasks: '업무', projects: '프로젝트', sites: '현장', docs: '문서', events: '일정' };
  toast(labels[section] + ' ' + changed + '건을 ' + (section === 'docs' ? '제출완료로' : '완료 처리했습니다.') + (skipped ? ' (이미 완료 ' + skipped + '건 제외)' : ''));
}

      else if (section === 'docs') db.docs = db.docs.filter(function (x) { return !del[x.id]; });
      else if (section === 'events') db.events = db.events.filter(function (x) { return !del[x.id]; });

/* ========================= derived data ========================= */
function isDone(t) { return t.status === 'done'; }
function isOverdue(t) {
  if (!t.due || t.status === 'done') return false;
  return t.due < todayISO();
}
function statusRank(t) {
  if (t.status === 'progress') return 0;
  if (t.status === 'waiting') return 1;
  return 2;
}
function taskSort(a, b) {
  if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  if (a.due && !b.due) return -1;
  if (!a.due && b.due) return 1;
  var r = statusRank(a) - statusRank(b);
  if (r !== 0) return r;
  return a.createdAt < b.createdAt ? 1 : -1;
}
function todayTasks() {
  var today = todayISO();
  return db.tasks.filter(function (t) { return t.due === today; })
    .sort(function (a, b) { return statusRank(a) - statusRank(b) || (a.createdAt < b.createdAt ? -1 : 1); });
}
function todoTasks() {
  // 완료되지 않은 모든 업무 — 마감일 빠른 순, 마감일 없는 항목은 뒤로(taskSort)
  return db.tasks.filter(function (t) { return !isDone(t); }).sort(taskSort);
}
function overdueTasks() {
  return db.tasks.filter(isOverdue).sort(function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
}
function upcomingTasks(maxDays) {
  var today = todayISO(), limit = typeof maxDays === 'number' ? maxDays : 3;
  return db.tasks.filter(function (t) {
    if (t.status === 'done' || !t.due) return false;
    var d = diffDays(today, t.due);
    return d >= 0 && d <= limit;
  }).sort(function (a, b) { return a.due < b.due ? -1 : 1; });
}
function stats() {
  var total = db.tasks.length, done = 0, progress = 0, waiting = 0;
  db.tasks.forEach(function (t) {
    if (t.status === 'done') done++;
    else if (t.status === 'progress') progress++;
    else waiting++;
  });
  var mk = todayISO().slice(0, 7);
  var monthDone = db.tasks.filter(function (t) {
    return t.status === 'done' && monthKeyOf(t.completedAt || t.due || t.createdAt) === mk;
  }).length;
  return {
    total: total, done: done, progress: progress, waiting: waiting,
    active: total - done, monthDone: monthDone, overdue: overdueTasks().length,
    rate: pct(done, total)
  };
}
function siteName(id) {
  var s = id ? byId(db.sites, id) : null;
  return s ? s.name : '';
}
function projectName(id) {
  var p = id ? byId(db.projects, id) : null;
  return p ? p.name : '';
}
function projectStats(projectId) {
  var ts = db.tasks.filter(function (t) { return t.projectId === projectId; });
  var done = ts.filter(isDone).length;
  return { total: ts.length, done: done, late: ts.filter(isOverdue).length, rate: pct(done, ts.length), tasks: ts };
}
function siteStats(siteId) {
  var ts = db.tasks.filter(function (t) { return t.siteId === siteId; });
  var done = ts.filter(isDone).length;
  var docs = db.docs.filter(function (d) { return d.siteId === siteId; });
  return {
    total: ts.length, done: done, late: ts.filter(isOverdue).length, rate: pct(done, ts.length),
    tasks: ts, docs: docs,
    docsDone: docs.filter(function (d) { return d.status === 'submitted'; }).length
  };

/* 업무가 속한 달 — 마감일이 있으면 마감일, 없으면 등록일 기준 */
function taskMonthKey(t) { return monthKeyOf((t && (t.due || t.createdAt)) || ''); }
/* 특정 월의 업무 현황 (월별 집계의 단일 기준) */
function monthTaskStats(key) {
  var total = 0, done = 0, progress = 0, waiting = 0;
  db.tasks.forEach(function (t) {
    if (taskMonthKey(t) !== key) return;
    total++;
    if (t.status === 'done') done++;
    else if (t.status === 'progress') progress++;
    else waiting++;
  });
  return { key: key, total: total, done: done, progress: progress, waiting: waiting, rate: pct(done, total) };
}
function monthKeysWithTasks() {
  var seen = {}, keys = [];
  db.tasks.forEach(function (t) {
    var k = taskMonthKey(t);
    if (k && !seen[k]) { seen[k] = 1; keys.push(k); }
  });
  keys.sort();
  return keys.reverse();
}
function monthlySeries(n) {
  var out = [], base = new Date();
  for (var i = n - 1; i >= 0; i--) {
    var d = new Date(base.getFullYear(), base.getMonth() - i, 1);
    var key = ymd(d).slice(0, 7);
    var m = monthTaskStats(key);
    out.push({ key: key, label: (d.getMonth() + 1) + '월', total: m.total, done: m.done, rate: m.rate });
  }
  return out;
}
function typeStats() {
  var out = [];
  [['company', '회사'], ['personal', '개인']].forEach(function (pair) {
    var ts = db.tasks.filter(function (t) { return t.type === pair[0]; });
    var done = ts.filter(isDone).length;
    out.push({
      key: pair[0], label: pair[1], total: ts.length, done: done,
      late: ts.filter(isOverdue).length, rate: pct(done, ts.length)
    });
  });
  return out;
}
function allSiteStats() {
  return db.sites.map(function (s) {
    var st = siteStats(s.id);
    return { site: s, total: st.total, done: st.done, late: st.late, rate: st.rate, docs: st.docs.length, docsDone: st.docsDone };
  }).sort(function (a, b) { return b.total - a.total; });
}
function docStats() {
  var total = db.docs.length;
  var submitted = db.docs.filter(function (d) { return d.status === 'submitted'; }).length;
  var writing = db.docs.filter(function (d) { return d.status === 'writing'; }).length;
  var fix = db.docs.filter(function (d) { return d.status === 'fix'; }).length;
  return { total: total, submitted: submitted, writing: writing, fix: fix, rate: pct(submitted, total) };
}

/* ========================= search / alerts ========================= */
function searchAll(q) {
  q = str(q).trim().toLowerCase();
  if (!q) return null;
  function hit(s) { return str(s).toLowerCase().indexOf(q) >= 0; }
  return {
    tasks: db.tasks.filter(function (t) { return hit(t.title) || hit(t.note) || hit(siteName(t.siteId)) || hit(projectName(t.projectId)); }).slice(0, 5),
    docs: db.docs.filter(function (d) { return hit(d.name) || hit(d.memo) || hit(d.category) || hit(siteName(d.siteId)); }).slice(0, 4),
    sites: db.sites.filter(function (s) { return hit(s.name) || hit(s.client) || hit(s.address) || hit(s.manager); }).slice(0, 4),
    events: db.events.filter(function (e) { return hit(e.title) || hit(e.memo); }).slice(0, 4)
  };
}
function notifications() {
  var today = todayISO();
  var overdue = overdueTasks();
  var dueToday = db.tasks.filter(function (t) { return t.due === today && t.status !== 'done'; });
  var soon = upcomingTasks(3).filter(function (t) { return t.due !== today; });
  var docSoon = db.docs.filter(function (d) {
    if (!d.due || d.status === 'submitted') return false;
    var n = diffDays(today, d.due);
    return n >= 0 && n <= 3;
  });
  return {
    overdue: overdue, dueToday: dueToday, soon: soon, docSoon: docSoon,
    count: overdue.length + dueToday.length + soon.length + docSoon.length
  };
}

/* ========================= toasts ========================= */
function toast(msg, kind) {
  var root = document.getElementById('toastRoot');
  if (!root) return;
  var el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = icon(kind === 'alert' ? 'alert' : 'check-circle', 16) + '<span>' + esc(msg) + '</span>';
  root.appendChild(el);
  setTimeout(function () {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 280);
  }, 2600);
}

function calCell(iso, monthIdx) {
  var d = parseISO(iso);

  var dow = d.getDay();
  var items = [];
  db.events.filter(function (e) { return e.date === iso; }).sort(function (a, b) { return a.title < b.title ? -1 : 1; }).forEach(function (e) {
    items.push('<span class="chip event-' + e.type + (e.done ? ' is-done' : '') + '">' + esc(e.title) + '</span>');
  });
  db.tasks.filter(function (t) { return t.due === iso; }).sort(taskSort).forEach(function (t) {
    var cls = 'chip task' + (isDone(t) ? ' done' : '') + (isOverdue(t) ? ' overdue' : '');
    items.push('<span class="' + cls + '">' + esc(t.title) + '</span>');

  if (items.length > 3) shown += '<span class="chip more">+' + (items.length - 3) + '건</span>';

    + ' data-action="open-day" data-date="' + iso + '" aria-label="' + fmtFull(iso) + ' 일정 열기">'

function kpi(label, value, iconName, tone, note, suffix) {

    + '<div class="kpi-label"><span style="color:inherit">' + icon(iconName, 15) + '</span>' + esc(label) + '</div>'

    + '</div>';

function barChartSVG(series) {
  var w = 540, h = 220, padL = 34, padR = 12, padT = 16, padB = 34;
  var max = 1;
  series.forEach(function (s) { max = Math.max(max, s.total, s.done); });
  max = Math.ceil(max / 4) * 4;
  var n = series.length;
  var slot = (w - padL - padR) / n;
  var barW = Math.min(20, slot * 0.26);
  var innerH = h - padT - padB;
  var grid = '';
  for (var g = 0; g <= 4; g++) {
    var val = (max / 4) * g;
    var y = h - padB - (val / max) * innerH;
    grid += '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" stroke="#EEF2F8" stroke-width="1"/>'
      + '<text x="' + (padL - 8) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="9.5" fill="#A3B0C2" font-family="inherit">' + Math.round(val) + '</text>';
  }
  var bars = '';
  series.forEach(function (s, i) {
    var cx = padL + slot * i + slot / 2;
    var totalH = (s.total / max) * innerH;
    var doneH = (s.done / max) * innerH;
    var xTotal = cx - barW - 2;
    var xDone = cx + 2;
    bars += '<rect x="' + xTotal + '" y="' + (h - padB - totalH) + '" width="' + barW + '" height="' + Math.max(totalH, s.total ? 2 : 0) + '" rx="3" fill="#DBEAFE"/>'
      + '<rect x="' + xDone + '" y="' + (h - padB - doneH) + '" width="' + barW + '" height="' + Math.max(doneH, s.done ? 2 : 0) + '" rx="3" fill="#2563EB"/>';
    if (s.total) {
      bars += '<text x="' + (cx - barW / 2 - 2) + '" y="' + (h - padB - totalH - 5) + '" text-anchor="middle" font-size="9.5" fill="#94A3B8" font-family="inherit">' + s.total + '</text>';
    }
    if (s.done) {
      bars += '<text x="' + (cx + barW / 2 + 2) + '" y="' + (h - padB - doneH - 5) + '" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2563EB" font-family="inherit">' + s.done + '</text>';
    }
    bars += '<text x="' + cx + '" y="' + (h - padB + 16) + '" text-anchor="middle" font-size="10.5" fill="#647687" font-family="inherit">' + s.label + '</text>';
  });
  var zero = max <= 4 && !series.some(function (s) { return s.total; })
    ? '<text x="' + (w / 2) + '" y="' + (h / 2 - 4) + '" text-anchor="middle" font-size="12" fill="#A3B0C2" font-family="inherit">등록된 업무가 없습니다</text>' : '';
  return '<svg class="bar-chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="월별 업무 완료 추이">'
    + grid + bars + zero
    + '<line x1="' + padL + '" y1="' + (h - padB) + '" x2="' + (w - padR) + '" y2="' + (h - padB) + '" stroke="#E2E8F0" stroke-width="1"/>'
    + '<rect x="' + (padL + 6) + '" y="4" width="9" height="9" rx="2" fill="#DBEAFE"/>'
    + '<text x="' + (padL + 20) + '" y="12" font-size="9.5" fill="#647687" font-family="inherit">전체</text>'
    + '<rect x="' + (padL + 50) + '" y="4" width="9" height="9" rx="2" fill="#2563EB"/>'
    + '<text x="' + (padL + 64) + '" y="12" font-size="9.5" fill="#647687" font-family="inherit">완료</text>'
    + '</svg>';
}

/* ------------------------- modal core ------------------------- */
function openModal(opts) {
  var root = document.getElementById('modalRoot');
  if (!root) return;
  root.innerHTML = '<div class="modal-backdrop">'
    + '<div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '">'
    + '<div class="modal-head"><h3>' + esc(opts.title) + '</h3>'
    + '<button class="icon-sm" data-action="close-modal" aria-label="닫기">' + icon('x', 18) + '</button></div>'
    + opts.body
    + (opts.foot ? '<div class="modal-foot">' + opts.foot + '</div>' : '')
    + '</div></div>';
  document.body.classList.add('modal-open');
  var first = root.querySelector('input:not([type=hidden]),textarea,select');
  if (first) {
    setTimeout(function () { try { first.focus(); } catch (e) { } }, 40);
  }
}
function closeModal() {
  var root = document.getElementById('modalRoot');
  if (root) root.innerHTML = '';
  document.body.classList.remove('modal-open');
  ui.pendingConfirm = null;
}
function openConfirm(opts) {
  ui.pendingConfirm = opts.onConfirm || null;
  openModal({
    title: opts.title || '확인',

    foot: '<button class="btn btn-ghost" data-action="close-modal">취소</button>'
      + '<button class="btn ' + (opts.danger === false ? 'btn-primary' : 'btn-danger') + '" data-action="confirm-ok">'
      + esc(opts.confirmLabel || '확인') + '</button>'

function fv(form, name) {
  var el = form.elements[name];
  return el ? str(el.value).trim() : '';
}
function fieldError(form, name, msg) {
  var el = form.elements[name];
  if (el) {
    el.classList.add('invalid');
    try { el.focus(); } catch (e) { }
    setTimeout(function () { el.classList.remove('invalid'); }, 2000);
  }
  toast(msg, 'alert');
}

function saveTaskForm(form) {
  var id = form.getAttribute('data-id');
  var title = fv(form, 'title');
  if (!title) return fieldError(form, 'title', '업무명을 입력해 주세요.');
  var status = fv(form, 'status');
  if (!TASK_STATUS[status]) status = 'waiting';
  var due = fv(form, 'due');
  var payload = {
    title: title,
    type: fv(form, 'type') === 'personal' ? 'personal' : 'company',
    status: status,
    due: isISODate(due) ? due : '',
    siteId: fv(form, 'siteId'),
    projectId: fv(form, 'projectId'),
    note: fv(form, 'note')
  };
  if (id) {
    var t = byId(db.tasks, id);
    if (!t) { closeModal(); render(); return; }
    Object.keys(payload).forEach(function (k) { t[k] = payload[k]; });
    if (t.status === 'done') { if (!t.completedAt) t.completedAt = todayISO(); }
    else t.completedAt = '';
    toast('업무를 수정했습니다.');
  } else {
    var nt = normTask(payload);
    nt.id = uid('task');
    nt.createdAt = new Date().toISOString();
    if (nt.status === 'done') nt.completedAt = todayISO();
    db.tasks.push(nt);
    toast('업무를 등록했습니다.');
  }
  saveDB();
  closeModal();
  render();
}

/* =========================================================
   노무비 대장 (labor ledger)
   ========================================================= */
var LABOR_KEY = 'construction_work_manager_labor_v1';
var LABOR_MAX_COMPANIES = 11;
var LABOR_MAX_WORKERS = 19;
var LABOR_MAX_DB = 41;

function emptyLabor() { return { version: 1, workers: [], months: {} }; }
function emptyLaborMonth(key) {
  key = key || currentMonthKey();
  return { base: key + '-01', companies: [], rows: [], logs: [], tax: true };
}
function normLaborWorker(w) {
  w = w || {};
  return {
    id: safeId(w.id, 'wrk'),
    name: str(w.name).slice(0, 40),
    rrn: str(w.rrn).slice(0, 20),
    phone: str(w.phone).slice(0, 24),
    addr: str(w.addr).slice(0, 200),
    bank: str(w.bank).slice(0, 40),
    account: str(w.account).slice(0, 48),
    holder: str(w.holder).slice(0, 40),
    rate: Math.max(0, Math.round(Number(w.rate) || 0))
  };
}
function normLaborCompany(c) {
  c = c || {};
  return {
    id: safeId(c.id, 'cmp'),
    no: str(c.no).slice(0, 40),
    client: str(c.client).slice(0, 60),
    abbr: str(c.abbr).slice(0, 4),
    name: str(c.name).slice(0, 120),
    memo: str(c.memo).slice(0, 200)
  };
}
function normLaborRow(r) {
  r = r || {};
  var days = {};
  var src = r.days && typeof r.days === 'object' ? r.days : {};
  Object.keys(src).forEach(function (k) {
    var d = Number(k);
    if (!(d >= 1 && d <= 31)) return;
    var x = src[k] || {};
    var v = Number(x.v);
    if (!isFinite(v) || v <= 0) return;
    v = Math.round(v * 100) / 100;
    if (v > 3) v = 3;
    days[String(d)] = { v: v, c: str(x.c).slice(0, 4) };
  });
  return { workerId: safeRef(r.workerId), days: days, paid: !!r.paid };
}
function normLaborLog(l) {
  l = l || {};
  return {
    id: safeId(l.id, 'log'),
    date: isISODate(l.date) ? l.date : todayISO(),
    projectNo: str(l.projectNo).slice(0, 40),
    client: str(l.client).slice(0, 60),
    name: str(l.name).slice(0, 120),
    work: str(l.work).slice(0, 300),
    done: !!l.done
  };
}
function loadLabor() {
  var raw = null;
  try { raw = window.localStorage.getItem(LABOR_KEY); } catch (e) { raw = null; }
  var d = emptyLabor();
  if (!raw) return d;
  var p = null;
  try { p = JSON.parse(raw); } catch (e) { return d; }
  if (!p || typeof p !== 'object') return d;
  d.workers = arr(p.workers).map(normLaborWorker).filter(function (w) { return w.name; });
  var months = p.months && typeof p.months === 'object' ? p.months : {};
  Object.keys(months).forEach(function (k) {
    if (!/^\d{4}-\d{2}$/.test(k)) return;
    var m = months[k] || {};
    var nm = emptyLaborMonth(k);
    nm.tax = m.tax !== false;
    nm.companies = arr(m.companies).map(normLaborCompany).filter(function (c) { return c.abbr || c.name; });
    nm.rows = arr(m.rows).map(normLaborRow).filter(function (r) { return r.workerId; });
    nm.logs = arr(m.logs).map(normLaborLog);
    d.months[k] = nm;
  });
  return d;
}
function saveLabor() {
  try { window.localStorage.setItem(LABOR_KEY, JSON.stringify(labor)); }
  catch (e) { toast('노무비 대장을 저장하지 못했습니다. 저장 공간을 확인해 주세요.', 'alert'); }
}
var labor = loadLabor();

function laborMonth() {
  var k = ui.laborMonth || currentMonthKey();
  if (!labor.months[k]) labor.months[k] = emptyLaborMonth(k);
  return labor.months[k];
}
function laborWorker(id) { return id ? byId(labor.workers, id) : null; }
function laborMonthRow(workerId) {
  var m = laborMonth();
  for (var i = 0; i < m.rows.length; i++) { if (m.rows[i].workerId === workerId) return m.rows[i]; }
  return null;
}
function laborDaysInMonth(key) {
  var p = str(key || currentMonthKey()).split('-');
  var y = Number(p[0]), mo = Number(p[1]);
  if (!y || !mo) return 31;
  return new Date(y, mo, 0).getDate();
}
function trimNum(n) {
  n = Math.round((Number(n) || 0) * 100) / 100;
  return String(n);
}
function won(n) {
  return Number(n || 0).toLocaleString('ko-KR') + '원';
}
function laborSerial(iso) {
  var p = str(iso).split('-');
  var t = Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return Math.round((t - Date.UTC(1899, 11, 30)) / 86400000);
}
function laborRowCalc(m, row) {
  var w = laborWorker(row.workerId) || {};
  var rate = Math.max(0, Number(w.rate) || 0);
  var dim = laborDaysInMonth(ui.laborMonth || currentMonthKey());
  var hours = 0, att = 0, early = 0, over = 0, per = {};
  for (var d = 1; d <= dim; d++) {
    var x = row.days[String(d)];
    if (!x) continue;
    var v = Number(x.v) || 0;
    if (v <= 0) continue;
    hours += v;
    att++;
    if (v < 1) early++;
    if (v > 1) over++;
    var a = x.c || '';
    if (a) per[a] = (per[a] || 0) + v;
  }
  var taxRaw = m.tax && rate > 0 ? Math.max(0, (rate - 100000) * 0.036 * att) : 0;
  var tax = Math.round(taxRaw);
  var local = Math.floor(taxRaw * 0.1 / 10) * 10;
  var deduct = Math.round(taxRaw + local);
  var gross = Math.round(hours * rate);
  return {
    hours: hours, att: att, early: early, over: over, per: per, rate: rate,
    tax: tax, local: local, deduct: deduct, gross: gross, net: gross - deduct
  };
}
function laborTotals(m) {
  var t = { hours: 0, gross: 0, tax: 0, local: 0, deduct: 0, net: 0, workers: m.rows.length, per: {} };
  m.companies.forEach(function (c) { t.per[c.abbr] = { hours: 0, amount: 0 }; });
  m.rows.forEach(function (row) {
    var rc = laborRowCalc(m, row);
    t.hours += rc.hours; t.gross += rc.gross; t.tax += rc.tax; t.local += rc.local;
    t.deduct += rc.deduct; t.net += rc.net;
    Object.keys(rc.per).forEach(function (a) {
      if (!t.per[a]) t.per[a] = { hours: 0, amount: 0 };
      t.per[a].hours += rc.per[a];
      t.per[a].amount += rc.per[a] * rc.rate;
    });
  });
  Object.keys(t.per).forEach(function (a) { t.per[a].amount = Math.round(t.per[a].amount); });
  return t;
}

/* ---------------- labor selection ---------------- */
function laborSelMap(kind) { if (!ui.laborSel[kind]) ui.laborSel[kind] = {}; return ui.laborSel[kind]; }
function laborSelHas(kind, id) { return id ? !!laborSelMap(kind)[id] : false; }

function syncLaborBulkUI() {
  ['comp', 'workers', 'rows', 'logs'].forEach(function (kind) {
    var root = document.querySelector('[data-labor-root="' + kind + '"]');
    if (!root) return;
    var boxes = document.querySelectorAll('[data-action="labor-item"][data-kind="' + kind + '"]');
    var total = boxes.length, checked = 0, i;
    for (i = 0; i < boxes.length; i++) { if (boxes[i].checked) checked++; }
    var allBoxes = document.querySelectorAll('[data-action="labor-all"][data-kind="' + kind + '"]');
    for (i = 0; i < allBoxes.length; i++) {
      allBoxes[i].checked = total > 0 && checked === total;
      allBoxes[i].indeterminate = checked > 0 && checked < total;
      allBoxes[i].disabled = total === 0;
    }
    var countEl = root.querySelector('[data-labor-count]');
    if (countEl) {
      countEl.textContent = checked + '건 선택';
      countEl.className = 'bulk-count' + (checked ? '' : ' zero');
    }
    var btns = root.querySelectorAll('[data-labor-btn]');
    for (i = 0; i < btns.length; i++) btns[i].disabled = !checked;
  });
}

  if (window.navigator && window.navigator.msSaveOrOpenBlob) {
    window.navigator.msSaveOrOpenBlob(blob, name);
    return;
  }

  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();

    if (a.parentNode) a.parentNode.removeChild(a);
  }, 600);
}
