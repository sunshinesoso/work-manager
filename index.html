  if (!closestBy(t, '.search-wrap')) { var sp = document.getElementById('searchPop'); if (sp) sp.hidden = true; }
  var el = t && t.closest ? t.closest('[data-action]') : null;
  if (!el) return;
  var action = el.getAttribute('data-action');
  var id = el.getAttribute('data-id');
  var date = el.getAttribute('data-date');
  if (action !== 'toggle-notif' && action !== 'toggle-profile') {
    var searchPop = document.getElementById('searchPop');
    if (searchPop) searchPop.hidden = true;
  }
  if (action !== 'toggle-notif') {
    var notifPop = document.getElementById('notifPop');
    if (notifPop) notifPop.hidden = true;
  }
  if (action !== 'toggle-profile') {
    var profilePop = document.getElementById('profilePop');
    if (profilePop) profilePop.hidden = true;
  }
  switch (action) {
    case 'go': go(el.getAttribute('data-view')); break;
    case 'toggle-sidebar': document.body.classList.toggle('nav-open'); break;
    case 'close-sidebar': closeSidebar(); break;
    case 'toggle-notif': {
      var pop = document.getElementById('notifPop');
      if (!pop) break;
      if (pop.hidden) { pop.innerHTML = notifHTML(); pop.hidden = false; }
      else pop.hidden = true;
      break;
    }
    case 'toggle-profile': {
      var menu = document.getElementById('profilePop');
      if (!menu) break;
      if (menu.hidden) { renderProfileMenu(); menu.hidden = false; }
      else menu.hidden = true;
      break;
    }
    case 'close-modal': closeModal(); break;
    case 'confirm-ok': {
      var cb = ui.pendingConfirm;
      ui.pendingConfirm = null;
      closeModal();
      if (typeof cb === 'function') cb();
      break;
    }
    case 'new-task': openTaskModal(null, {
      due: date || '',
      siteId: el.getAttribute('data-site') || '',
      projectId: el.getAttribute('data-project') || ''
    }); break;
    case 'edit-task': openTaskModal(id); break;
    case 'del-task': deleteTask(id); break;
    case 'new-project': openProjectModal(); break;
    case 'edit-project': openProjectModal(id); break;
    case 'del-project': deleteProject(id); break;
    case 'project-detail': openProjectDetail(id); break;
    case 'new-site': openSiteModal(); break;
    case 'edit-site': openSiteModal(id); break;
    case 'del-site': deleteSite(id); break;
    case 'site-detail': openSiteDetail(id); break;
    case 'new-doc': openDocModal(null, { siteId: el.getAttribute('data-site') || '' }); break;
    case 'edit-doc': openDocModal(id); break;
    case 'del-doc': deleteDoc(id); break;
    case 'new-event': openEventModal(null, date || todayISO()); break;
    case 'edit-event': openEventModal(id); break;
    case 'del-event': deleteEvent(id); break;
    case 'open-day': openDayModal(date); break;
    case 'week-prev': ui.weekOffset -= 1; render(); break;
    case 'week-next': ui.weekOffset += 1; render(); break;
    case 'week-today': ui.weekOffset = 0; render(); break;
    case 'dash-month-prev': setDashMonth(monthKeyAdd(dashMonthKey(), -1)); break;
    case 'dash-month-next': setDashMonth(monthKeyAdd(dashMonthKey(), 1)); break;
    case 'dash-month-now': setDashMonth(currentMonthKey()); break;    case 'month-detail': openMonthTasks(el.getAttribute('data-month') || dashMonthKey()); break;
    case 'cal-prev': {
      var cm = ui.calMonth || new Date();
      ui.calMonth = new Date(cm.getFullYear(), cm.getMonth() - 1, 1);
      render(); break;
    }
    case 'cal-next': {
      var cm2 = ui.calMonth || new Date();
      ui.calMonth = new Date(cm2.getFullYear(), cm2.getMonth() + 1, 1);
      render(); break;
    }
    case 'cal-today': ui.calMonth = new Date(); render(); break;
    case 'reset-task-filter': ui.task = { q: '', status: 'all', type: 'all', site: 'all', month: 'all' }; render(); break;
    case 'reset-doc-filter': ui.doc = { q: '', site: 'all', cat: 'all', status: 'all' }; render(); break;
    case 'bulk-complete': bulkComplete(el.getAttribute('data-bulk')); break;
    case 'bulk-delete': bulkDelete(el.getAttribute('data-bulk')); break;
    case 'labor-load-prev': laborLoadPrevMonth(); break;
    case 'labor-export': exportLaborXlsx(); break;
    case 'labor-tax': laborToggleTax(); break;
    case 'labor-new-company': openCompanyModal(); break;
    case 'labor-edit-company': openCompanyModal(id); break;
    case 'labor-del-company': deleteLaborCompany(id); break;
    case 'labor-import-sites': openImportCompanies(); break;
    case 'labor-add-company': addCompanyFromSource(el.getAttribute('data-kind'), id); break;
    case 'labor-new-worker': openWorkerModal(); break;
    case 'labor-edit-worker': openWorkerModal(id); break;
    case 'labor-del-worker': deleteLaborWorker(id); break;
    case 'labor-add-selected': laborAddSelectedWorkers(); break;
    case 'labor-day': openLaborDay(el.getAttribute('data-worker'), Number(el.getAttribute('data-day'))); break;
    case 'labor-quick': laborQuickValue(Number(el.getAttribute('data-v'))); break;
    case 'labor-bulk-h': laborBulkHours(); break;
    case 'labor-bulk-c': laborBulkCompany(); break;
    case 'labor-bulk-paid': laborBulkPaid(); break;
    case 'labor-bulk-remove': laborBulkRemove(); break;
    case 'labor-bulk-del': laborBulkDelete(el.getAttribute('data-kind')); break;
    case 'labor-bulk-done': laborBulkDone(); break;
    case 'labor-new-log': openLogModal(); break;
    case 'labor-edit-log': openLogModal(id); break;
    case 'labor-del-log': deleteLaborLog(id); break;
    case 'labor-log-done': toggleLaborLog(id); break;
    case 'export-json': exportJSON(); break;
    case 'import-json': {
      var fi = document.getElementById('importFile');
      if (fi) fi.click();
      break;
    }
    case 'reset-data': resetAll(); break;
    case 'csv-tasks': exportTasksCSV(); break;
    case 'csv-sites': exportSitesCSV(); break;
    case 'csv-months': exportMonthsCSV(); break;
    case 'csv-all': exportAllCSV(); break;
    default: break;
  }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (!el || el.nodeType !== 1) return;
  if (el.id === 'importFile') {
    if (el.files && el.files[0]) importJSON(el.files[0]);
    el.value = '';
    return;
  }
  if (el.id === 'logCompanyPick') {
    var m0 = laborMonth();
    var cmp = byId(m0.companies, el.value);
    var f = el.form || document.getElementById('laborLogForm');
    if (cmp && f && f.elements) {
      if (f.elements.projectNo) f.elements.projectNo.value = cmp.no || '';
      if (f.elements.client) f.elements.client.value = cmp.client || '';
      if (f.elements.name) f.elements.name.value = cmp.name || '';
    }
    return;
  }
  var action = el.getAttribute ? el.getAttribute('data-action') : null;
  if (action === 'bulk-item') { bulkItemToggle(el); return; }
  if (action === 'bulk-all') { bulkSelectAll(el.getAttribute('data-bulk'), el.checked); return; }
  if (action === 'labor-item') { laborItemToggle(el); return; }
  if (action === 'labor-all') { laborSelectAll(el.getAttribute('data-kind'), el.checked); return; }
  if (action === 'labor-month') { setLaborMonth(el.value); return; }
  if (action === 'toggle-task') { toggleTask(el.getAttribute('data-id'), el.checked); return; }
  if (action === 'set-task-status') { setTaskStatus(el.getAttribute('data-id'), el.value); return; }
  if (action === 'set-doc-status') { setDocStatus(el.getAttribute('data-id'), el.value); return; }
  var filter = el.getAttribute ? el.getAttribute('data-filter') : null;
  if (filter) { applyFilter(filter, el.value); return; }
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (!el || el.nodeType !== 1 || !el.id) return;
  if (el.id === 'globalSearch') { renderSearchPop(el.value); return; }
  if (el.id === 'taskSearch') {
    ui.task.q = el.value;
    clearTimeout(ui.searchTimer);
    ui.searchTimer = setTimeout(function () { rerenderKeepingFocus('taskSearch', el.value.length); }, 220);
    return;
  }
  if (el.id === 'docSearch') {
    ui.doc.q = el.value;
    clearTimeout(ui.searchTimer);
    ui.searchTimer = setTimeout(function () { rerenderKeepingFocus('docSearch', el.value.length); }, 220);
    return;
  }
  if (el.id === 'userName' || el.id === 'userInitials') {
    var nameEl = document.getElementById('userName');
    var iniEl = document.getElementById('userInitials');
    var pName = document.getElementById('previewName');
    var pAv = document.getElementById('previewAvatar');
    var nm = nameEl ? nameEl.value.trim() : '';
    var ini = iniEl ? iniEl.value.trim() : '';
    if (pName) pName.textContent = nm || '이름 없음';
    if (pAv) pAv.textContent = ini || (nm ? nm.slice(0, 2) : 'ny');
  }
});
document.addEventListener('submit', function (e) {
  var form = e.target;
  if (!form || !form.id) return;
  if (form.id === 'profileForm') {
    e.preventDefault();
    var name = fv(form, 'userName');
    if (!name) { fieldError(form, 'userName', '이름을 입력해 주세요.'); return; }
    var ini = fv(form, 'userInitials');
    db.user.name = name.slice(0, 20);
    db.user.initials = (ini || name.slice(0, 2)).slice(0, 3);
    saveDB();
    render();
    toast('사용자 정보를 저장했습니다.');
    return;
  }
  if (form.id === 'taskForm') { e.preventDefault(); saveTaskForm(form); return; }
  if (form.id === 'projectForm') { e.preventDefault(); saveProjectForm(form); return; }
  if (form.id === 'siteForm') { e.preventDefault(); saveSiteForm(form); return; }
  if (form.id === 'docForm') { e.preventDefault(); saveDocForm(form); return; }
  if (form.id === 'eventForm') { e.preventDefault(); saveEventForm(form); return; }
  if (form.id === 'laborWorkerForm') { e.preventDefault(); saveLaborWorkerForm(form); return; }
  if (form.id === 'laborCompanyForm') { e.preventDefault(); saveLaborCompanyForm(form); return; }
  if (form.id === 'laborDayForm') { e.preventDefault(); saveLaborDayForm(form); return; }
  if (form.id === 'laborLogForm') { e.preventDefault(); saveLaborLogForm(form); return; }
});
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute) {
    var act = e.target.getAttribute('data-action');
    if (act === 'month-detail') {
      e.preventDefault();
      openMonthTasks(e.target.getAttribute('data-month') || dashMonthKey());
      return;
    }
  }
  if (e.key === 'Escape' || e.key === 'Esc') {
    var modal = document.querySelector('.modal-backdrop');
    if (modal) { closeModal(); return; }
    closePops();
    closeSidebar();
  }
});
window.addEventListener('storage', function (e) {
  if (e && e.key === STORE_KEY) {
    db = loadDB();
    render();
  } else if (e && e.key === LABOR_KEY) {
    labor = loadLabor();
    render();
  }
});

/* ------------------------- init ------------------------- */
function init() {
  hydrateIcons();
  if (!ui.calMonth) ui.calMonth = new Date();
  if (!ui.dashMonth) ui.dashMonth = currentMonthKey();
  render();
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>
</body>
</html>
